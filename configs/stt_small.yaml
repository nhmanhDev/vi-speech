# ~20M tham số. Mục tiêu: chạy realtime trên CPU laptop / Raspberry Pi 5 sau khi int8.
model:
  d_model: 256
  n_heads: 4
  n_layers: 12
  ff_mult: 4
  conv_kernel: 15
  dropout: 0.1
  subsampling_channels: 256
train:
  lr: 1.5e-3
  warmup_steps: 5000
  total_steps: 150000
  max_batch_frames: 40000   # T4 16GB, fp16
